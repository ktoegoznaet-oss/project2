version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: radio_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-radio}
      POSTGRES_USER: ${POSTGRES_USER:-radio_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-radio_secret_2024}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./backend/db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    networks:
      - radio_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-radio_user} -d ${POSTGRES_DB:-radio}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: radio_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - radio_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: radio_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "3000:3000"
    volumes:
      - music_data:/app/music
      - jingles_data:/app/jingles
      - hls_data:/app/hls
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - radio_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: radio_frontend
    restart: unless-stopped
    env_file:
      - ./frontend/.env
    ports:
      - "3001:3000"
    depends_on:
      - backend
    networks:
      - radio_network

  icecast:
    build:
      context: ./streaming
      dockerfile: Dockerfile
    container_name: radio_icecast
    restart: unless-stopped
    ports:
      - "8000:8000"
      - "8001:8001"
    volumes:
      - music_data:/music
      - jingles_data:/jingles
    depends_on:
      - backend
    networks:
      - radio_network

  nginx:
    image: nginx:1.25-alpine
    container_name: radio_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/radio.conf:/etc/nginx/conf.d/default.conf
      - ssl_certs:/etc/letsencrypt
    depends_on:
      - frontend
      - backend
      - icecast
    networks:
      - radio_network

volumes:
  postgres_data:
  redis_data:
  music_data:
  jingles_data:
  hls_data:
  ssl_certs:

networks:
  radio_network:
    driver: bridge
